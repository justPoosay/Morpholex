kind = "web"
previewPath = "/"
title = "Word Transformer"
version = "1.0.0"
id = "artifacts/word-transformer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21707

[services.development]
run = "pnpm --filter @workspace/word-transformer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/word-transformer", "run", "build" ]
publicDir = "artifacts/word-transformer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21707"
BASE_PATH = "/"
